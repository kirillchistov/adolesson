name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Формат коммитов — Conventional Commits (см. AGENTS.md).
  # Задачи сборки и тестов добавляются вместе с каркасом frontend/backend.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
