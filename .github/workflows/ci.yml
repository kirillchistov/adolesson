name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Формат коммитов — Conventional Commits (см. AGENTS.md).
  # Задачи frontend/backend добавляются вместе с каркасом.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
