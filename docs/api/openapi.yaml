        Личная заметка родителя. Подросток эти записи не читает.
        visibility `parents` открывает заметку другим родителям семьи, не подростку.
    ParentNoteWrite:
      type: object
      required:
        - visibility
        - kind
        - text
      properties:
        visibility:
          $ref: '#/components/schemas/NoteVisibility'
        kind:
          $ref: '#/components/schemas/NoteKind'
        text:
          type: string
          minLength: 1
          maxLength: 4000
    Pronouns:
      type: string
      enum:
        - f
        - m
        - neutral
    Role:
      type: string
      enum:
        - parent
        - teen
    Session:
      type: object
      required:
        - member
        - family
      properties:
        member:
          $ref: '#/components/schemas/Member'
        family:
          $ref: '#/components/schemas/Family'
      description: Текущая сессия. Cookie `session` выставляет сервер.
    SessionCreate:
      type: object
      required:
        - login
        - secret
      properties:
        login:
          allOf:
            - $ref: '#/components/schemas/Login'
          pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
        secret:
          type: string
          minLength: 1
          maxLength: 64
    Signal:
      type: object
      required:
        - id
