      type: string
      enum:
        - green
        - yellow
        - red
    SignalWrite:
      type: object
      required:
        - color
      properties:
        color:
          $ref: '#/components/schemas/SignalColor'
    TableNote:
      type: object
      required:
        - id
        - authorId
        - kind
        - text
        - at
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TableNoteKind'
        text:
          type: string
          minLength: 1
          maxLength: 500
        at:
          type: string
          format: date-time
    TableNoteKind:
      type: string
      enum:
        - barrier
        - factor
        - seen
      description: |-
        Короткая фраза, которую автор сам положил на стол.
        barrier и factor — подросток, seen — родитель.
        Баллов карты и ответов опросника здесь нет.
    TableNoteWrite:
      type: object
      required:
        - kind
        - text
      properties:
        kind:
          $ref: '#/components/schemas/TableNoteKind'
        text:
          type: string
          minLength: 1
          maxLength: 500
    UnauthorizedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - unauthorized
        message:
          type: string
    ValidationError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - validation_error
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
