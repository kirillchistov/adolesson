      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/HelpStatus'
        reply:
          type: string
          maxLength: 500
    HelpStatus:
      type: string
      enum:
        - sent
        - seen
        - scheduled
        - done
      description: Просьба на общем столе. «Давай завтра» — это ответ в reply, статус seen или scheduled.
    Invitation:
      type: object
      required:
        - token
        - role
        - expiresAt
      properties:
        token:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expiresAt:
          type: string
          format: date-time
      description: Приглашение по ссылке. Токен показывается создателю один раз.
    InvitationAccept:
      type: object
      required:
        - displayName
        - pronouns
        - login
        - secret
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        pronouns:
          $ref: '#/components/schemas/Pronouns'
        login:
          allOf:
            - $ref: '#/components/schemas/Login'
          pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
        secret:
          type: string
          minLength: 4
          maxLength: 64
    InvitationCreate:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
    InvitationPreview:
      type: object
      required:
        - familyName
        - role
        - expiresAt
      properties:
        familyName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expiresAt:
          type: string
          format: date-time
      description: То, что можно показать до принятия приглашения, без секретов семьи.
    Login:
      type: string
    Member:
      type: object
      required:
        - id
        - role
        - displayName
        - pronouns
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        pronouns:
          $ref: '#/components/schemas/Pronouns'
      description: Участник семьи. Пароль и PIN в ответах не возвращаются.
    MemberUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        pronouns:
          $ref: '#/components/schemas/Pronouns'
    NotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - not_found
        message:
          type: string
    NoteKind:
      type: string
      enum:
        - observation
        - reaction
        - school
    NoteVisibility:
      type: string
      enum:
        - self
        - parents
    ParentNote:
      type: object
      required:
        - id
        - authorId
        - visibility
        - kind
        - text
        - at
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/NoteVisibility'
        kind:
          $ref: '#/components/schemas/NoteKind'
        text:
          type: string
          minLength: 1
          maxLength: 4000
        at:
          type: string
          format: date-time
